name: shellcheck

on:
  push:
    paths:
      - "scripts/**.sh"
  pull_request:
    paths:
      - "scripts/**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
